# TRON2 training task configuration template.
# Copy this file to configs/train/tron2_tasks/<task>.yaml and adjust values.
#
# Usage:
#   export HF_LEROBOT_HOME=/path/to/datasets
#   uv run scripts/compute_norm_stats.py --task-config configs/train/tron2_tasks/<task>.yaml
#   uv run scripts/train_tron2_task.py --task-config configs/train/tron2_tasks/<task>.yaml

# Unique config name. Used as the checkpoint subdirectory name.
name: pi05_tron2_example

# LeRobot dataset repo id, local path, or Hugging Face Hub id.
repo_id: example_dataset

# Natural language task instruction.
prompt: Pick up the object and place it on the target

# Use each LeRobot episode's task text instead of the fallback prompt above.
prompt_from_task: false

# Path to pretrained weights, for example the pi0.5 base params or a prior checkpoint.
weight_loader: gs://openpi-assets/checkpoints/pi05_base/params

# Training settings.
num_train_steps: 20000
save_interval: 5000
batch_size: 32
action_horizon: 50
state_dim: 16

# Training-time RTC. Set null or remove to disable.
rtc_training_simulated_delay: 10

# Camera observation keys in the LeRobot parquet files.
cam_high_key: observation.images.cam_high
cam_left_wrist_key: observation.images.cam_left_wrist
cam_right_wrist_key: observation.images.cam_right_wrist

# Optional crop regions applied before resize during training and inference.
crop_config:
  observation.images.cam_high:
    x: 120
    y: 140
    w: 500
    h: 340
  observation.images.cam_left_wrist:
    x: 0
    y: 0
    w: 640
    h: 480
  observation.images.cam_right_wrist:
    x: 0
    y: 0
    w: 640
    h: 480

# State and action keys.
state_key: observation.state
action_key: action

# TRON2 data should normally keep these false.
adapt_to_pi: false
use_delta_joint_actions: false

# Output paths.
assets_base_dir: ./assets
checkpoint_base_dir: ./checkpoints
