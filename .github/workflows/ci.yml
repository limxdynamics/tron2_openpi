name: Software CPU checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "*"

permissions:
  contents: read

jobs:
  software-cpu-tests:
    name: Python 3.11 software CPU tests (no GPU; no robot hardware)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GIT_LFS_SKIP_SMUDGE: true
      PYTHONPYCACHEPREFIX: /tmp/tron2-openpi-pycache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install software test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e packages/openpi-client
      - name: Check repository readiness
        run: python -m pytest -q tests/test_repository_readiness.py
      - name: Test openpi-client CPU utilities
        run: |
          python -m pytest -q \
            packages/openpi-client/src/openpi_client/image_tools_test.py \
            packages/openpi-client/src/openpi_client/msgpack_numpy_test.py \
            packages/openpi-client/src/openpi_client/er2_test.py
      - name: Compile Python sources
        run: python -m compileall -q .
